[loggers]
keys=root,console,file

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=commonFormatter

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler

[logger_console]
level=INFO
handlers=consoleHandler
qualname=console

[logger_file]
level=INFO
handlers=fileHandler
qualname=file

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=commonFormatter
args=(sys.stdout, )

[handler_fileHandler]
class=FileHandler
level=INFO
formatter=commonFormatter
args=('tests\log.txt', 'w')

[formatter_commonFormatter]
format=[%(asctime)s][%(levelname)s] - log.txt: %(message)s
datefmt=
